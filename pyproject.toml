[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-ops-semantic-search"
version = "0.1.0"
description = "A typed semantic search service for tenant onboarding, account lifecycle, and admin operations."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/saas_ops_search"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

